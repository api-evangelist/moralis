      description: List top tokens trending based on trading activity, volume, liquidity and more. By default this returns cross-chain results, including Solana. Optionally filter by `chain` for single chain results.
      x-mcp-prompt: Request trending tokens, specifying the chain if needed. Use this when users ask for currently popular tokens or want to explore current market trends. What are the top tokens right now? What are the trending tokens in the last 24 hours?
  /tokens/{tokenAddress}/analytics:
    get:
      security:
      - ApiKeyAuth: []
      tags:
      - Token
      x-tag-sdk: token
      summary: Get token analytics by token address
      description: Retrieve detailed trading analytics for a specific token, including buy volume, sell volume, buyers, sellers, transactions, liquidity and FDV trends over time.
      operationId: getTokenAnalytics
      parameters:
      - in: query
        name: chain
        description: The chain to query
        required: false
        schema:
          $ref: '#/components/schemas/chainListWithSolana'
      - in: path
        name: tokenAddress
        description: The token address to query
        required: true
        schema:
          type: string
          example: '0x6982508145454ce325ddbe47a25d4ec3d2311933'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAnalyticsData'
      x-mcp-prompt: Provide the token address and time period to fetch its trading analytics. Use this when users want in-depth token performance data or are analyzing a token's market behavior.
  /tokens/{tokenAddress}/score:
    get:
      security:
      - ApiKeyAuth: []
      tags:
      - Token
      x-tag-sdk: token
      summary: Get token score by token address
      description: Retrieve a score for a specific token along with detailed metrics including price, volume, liquidity, transaction counts, and supply information.
      operationId: getTokenScore
      parameters:
      - in: query
        name: chain
        description: The chain to query
        required: false
        schema:
          $ref: '#/components/schemas/chainListWithSolana'
      - in: path
        name: tokenAddress
        description: The token address to query
        required: true
        schema:
          type: string
          example: '0x6982508145454ce325ddbe47a25d4ec3d2311933'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenScoreResponse'
      x-mcp-prompt: Provide the token address to fetch its internal score and metrics. Use this when users want to evaluate a token's performance metrics or need scoring data for analysis.
  /tokens/{tokenAddress}/score/historical:
    get:
      security:
      - ApiKeyAuth: []
      tags:
      - Token
      x-tag-sdk: token
      summary: Get historical token score by token address
      description: Retrieve historical score data for a specific token over time.
      operationId: getHistoricalTokenScore
      parameters:
      - in: query
        name: chain
        description: The chain to query
        required: false
        schema:
          $ref: '#/components/schemas/chainListWithSolana'
      - in: path
        name: tokenAddress
        description: The token address to query
        required: true
        schema:
          type: string
          example: '0x6982508145454ce325ddbe47a25d4ec3d2311933'
      - in: query
        name: timeframe
        description: The timeframe to query
        required: true
        schema:
          type: string
          example: 1d
          default: 1d
          enum:
          - 1d
          - 7d
          - 30d
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalTokenScoreResponse'
      x-mcp-prompt: Provide the token address and timeframe to fetch its historical score data. Use this when users want to track a token's score over time.
  /tokens/analytics:
    post:
      security:
      - ApiKeyAuth: []
      tags:
      - Token
      x-tag-sdk: token
      summary: Get token analytics for a list of token addresses
      description: Fetch analytics for multiple tokens, including buy volume, sell volume, buyers, sellers, transactions, liquidity and FDV trends over time. Accepts an array of up to 200 `tokens`, each requiring `chain` and `tokenAddress`.
      operationId: getMultipleTokenAnalytics
      requestBody:
        description: Body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMultipleTokenAnalyticsDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipleTokenAnalyticsData'
      x-mcp-prompt: Submit a list of token addresses and time period to retrieve their analytics. Use this when users want performance data for multiple tokens or are comparing token metrics.
